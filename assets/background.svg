<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="battlefieldPattern" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#8B4513" /> <!-- SaddleBrown -->
      <circle cx="25" cy="25" r="15" fill="#A0522D" opacity="0.6"/> <!-- Sienna, for a crater -->
      <circle cx="75" cy="50" r="20" fill="#808080" opacity="0.5"/> <!-- Gray, for another crater/disturbed earth -->
      <circle cx="50" cy="80" r="10" fill="#A0522D" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#battlefieldPattern)" />
</svg>
